<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: wheat;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
        }

        .logo {
            color: #222;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-links a {
            color: #222;
            text-decoration: none;
        }


        .header {
            text-align: center;
        }

        .article {
            text-align: center;
        }

        .blog-container {
            display: flex;
            flex-wrap: wrap;
            gap: 60px;
            padding-left: 20px;
        }

        .blog-card {
            width: 300px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
            background-color: white;
        }

        .blog-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
        }

        .blog-card h2 {
            margin-top: 10px;
        }

        .blog-card p {
            margin: 8px 0;
        }

        .register-container {
            width: 350px;
            margin: 50px auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ccc;
        }

        .register-title {
            text-align: center;
            margin-bottom: 25px;
        }

        .register-container label {
            display: block;
            margin-bottom: 5px;
        }

        .register-container input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        .register-container button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            background-color: #287be0;
        }

        .login-text {
            text-align: center;
            margin-top: 25px;
        }

        .login-text a {
            color: #287be0;
            text-decoration: none;
        }

        .login-page {
            min-height: 90vh;
            /* background-color: #f4f7fb; */
            padding: 60px 0;
        }

        .login-container {
            width: 450px;
            margin: auto;
            padding: 40px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px #d5d5d5;
        }

        .login-container h1 {
            text-align: center;
            margin-bottom: 40px;
            color: #222;
        }

        .login-container label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        .login-container input {
            width: 100%;
            padding: 13px;
            margin-bottom: 25px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 15px;
        }

        .login-container input:focus {
            outline: none;
            border-color: #287be0;
        }

        .login-container button {
            width: 100%;
            padding: 13px;
            background-color: #287be0;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .login-container button:hover {
            background-color: #1769c2;
        }

        .register-text {
            text-align: center;
            margin-top: 30px;
            color: #444;
        }

        .register-text a {
            color: #287be0;
            text-decoration: none;
            font-weight: bold;
        }

        .add-blog-page {
            min-height: 90vh;
            /* background-color: #f4f7fb; */
            padding: 40px 0;
        }

        .add-blog-container {
            width: 520px;
            margin: auto;
            padding: 35px;
            background-color: white;
            border-radius: 5px;
            box-shadow: 0 2px 10px #ddd;
        }

        .add-blog-container h1 {
            text-align: center;
            margin-bottom: 35px;
            color: #222;
        }

        .add-blog-container label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        .add-blog-container input[type="text"],
        .add-blog-container textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-bottom: 25px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 15px;
        }

        .add-blog-container textarea {
            height: 145px;
            resize: vertical;
        }

        .add-blog-container input[type="file"] {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-bottom: 25px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .add-blog-container button {
            width: 100%;
            padding: 13px;
            background-color: #287be0;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        .add-blog-container button:hover {
            background-color: #1769c2;
        }

        .blog-detail-container {
            width: 520px;
            margin: 40px auto;
            padding: 30px;
            background-color: white;
            box-shadow: 0 2px 10px #ddd;
            border-radius: 5px;
        }

        .blog-detail-container h1 {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 28px;
            color: #222;
        }

        .blog-info {
            color: #555;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .blog-info span {
            margin: 0 8px;
        }

        .blog-detail-image {
            width: 100%;
            max-height: 350px;
            object-fit: cover;
            display: block;
            margin-bottom: 20px;
        }

        .blog-content {
            font-size: 16px;
            line-height: 1.6;
            color: #333;
        }

        .back-home-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 18px;
            background-color: #287be0;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .back-home-btn:hover {
            background-color: #1769c2;
        }

        .logout-btn {
            background-color: #dc3545;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            text-decoration: none;
        }

        .logout-btn:hover {
            background-color: #b02a37;
        }
    </style>
</head>

<body>

    <nav>
        <a href="{% url 'home'%}" class="logo">MyBlogSpace</a>
        <div class="nav-links">
            <a href="/home/">Home</a>
            <a href="/register/">Register</a>
            <a href="/login/">Login</a>
            <a href="/add-blog/">Add Blog</a>
            <a href="{% url 'logout' %}" class="logout-btn">Logout ↪</a>
        </div>
    </nav>
    {% block content %}
    {% endblock %}
</body>

</html>
