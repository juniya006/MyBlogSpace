{% extends 'base.html' %}
{% load static %}
{% block content %}

<div class="blog-detail-container">

    <h1>{{ blog.title }}</h1>

    <div class="blog-info">
        👤 {{ blog.author.username }}
        <span>•</span>
        {{ blog.created_at|date:"M d, Y" }}
    </div>

    {% if blog.image %}
        <img src="{{ blog.image.url }}" class="blog-detail-image">
    {% endif %}

    <p class="blog-content">
        {{ blog.content }}
    </p>
    <a href="{% url 'home' %}" class="back-home-btn">
    ← Back to Home
    </a>

</div>

{% endblock %}
